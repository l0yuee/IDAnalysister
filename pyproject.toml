[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idanalysister"
version = "0.1.0"
description = "Declarative argument extraction and intra-function value resolution framework for IDA Pro"
requires-python = ">=3.13"
readme = "README.md"
license = { text = "Proprietary" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_ida: test needs a real IDA Pro / idalib installation",
    "requires_hexrays: test needs a licensed Hex-Rays decompiler",
]
